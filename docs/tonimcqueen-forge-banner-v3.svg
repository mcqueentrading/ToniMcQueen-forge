<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 180" role="img" aria-labelledby="title desc">
  <title id="title">ToniMcQueen's Forge</title>
  <desc id="desc">Matrix-inspired terminal banner for the ToniMcQueen Creator 5 Pro firmware fork.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#070d0b"/>
      <stop offset="0.55" stop-color="#101c1a"/>
      <stop offset="1" stop-color="#171d19"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#55d879" stroke-opacity=".13"/>
    </pattern>
  </defs>
  <rect width="1200" height="180" rx="12" fill="url(#background)"/>
  <rect x="2" y="2" width="1196" height="176" rx="10" fill="url(#grid)" stroke="#43bd68" stroke-width="2"/>
  <g font-family="monospace" font-size="14">
    <text x="34" y="31" fill="#63dc7d">0101 0011 0100 0100</text>
    <text x="1050" y="31" fill="#d2b05a">[ ONLINE ]</text>
    <text x="34" y="158" fill="#58b9b0">forge.boot / creator5pro</text>
    <text x="1000" y="158" fill="#78977d">CMYW // IMAGEMAP</text>
  </g>
  <path d="M32 48H1168" stroke="#2c7544" stroke-width="1"/>
  <path d="M32 136H1168" stroke="#2c7544" stroke-width="1"/>
  <text x="600" y="108" text-anchor="middle" fill="#e2eee2" font-family="monospace" font-size="43" font-weight="700" letter-spacing="1">ToniMcQueen's Forge</text>
  <circle cx="1150" cy="158" r="4" fill="#d2b05a"/>
</svg>
