<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 180" role="img" aria-labelledby="title desc">
  <title id="title">ToniMcQueen's Forge</title>
  <desc id="desc">Matrix-inspired holographic glass banner for the ToniMcQueen Creator 5 Pro firmware fork.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#040811"/>
      <stop offset="0.45" stop-color="#08152b"/>
      <stop offset="0.72" stop-color="#0b2030"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="holo" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#4dcfff" stop-opacity=".05"/>
      <stop offset=".32" stop-color="#4da6ff" stop-opacity=".24"/>
      <stop offset=".58" stop-color="#76d8ff" stop-opacity=".14"/>
      <stop offset=".82" stop-color="#e1bd6b" stop-opacity=".18"/>
      <stop offset="1" stop-color="#4dcfff" stop-opacity=".05"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffffff" stop-opacity=".34"/>
      <stop offset=".18" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".82" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".18"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#4da6ff" stroke-opacity=".16"/>
    </pattern>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 0H4" stroke="#d7fff0" stroke-opacity=".05"/>
    </pattern>
    <filter id="soft" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect width="1200" height="180" rx="12" fill="url(#background)"/>
  <ellipse cx="600" cy="92" rx="500" ry="70" fill="#4da6ff" fill-opacity=".12" filter="url(#soft)"/>
  <rect x="2" y="2" width="1196" height="176" rx="10" fill="url(#grid)" stroke="#4da6ff" stroke-width="2"/>

  <rect x="22" y="19" width="1156" height="142" rx="14" fill="url(#holo)" stroke="#b8eee0" stroke-opacity=".28"/>
  <rect x="22" y="19" width="1156" height="142" rx="14" fill="url(#shine)"/>
  <rect x="22" y="19" width="1156" height="142" rx="14" fill="url(#scanlines)"/>

  <g font-family="monospace" font-size="14">
    <text x="42" y="43" fill="#62c7ff">0101 0011 0100 0100</text>
    <text x="1055" y="43" fill="#e0bd6b">[ ONLINE ]</text>
    <text x="42" y="148" fill="#61c8d8">forge.boot / creator5pro</text>
    <text x="997" y="148" fill="#8fa8bd">CMYW // IMAGEMAP</text>
  </g>

  <path d="M40 58H1160M40 132H1160" stroke="#63c7ff" stroke-opacity=".28"/>
  <text x="600" y="108" text-anchor="middle" fill="#effff2" font-family="monospace" font-size="43" font-weight="700" letter-spacing="1">ToniMcQueen's Forge</text>
  <circle cx="1148" cy="148" r="4" fill="#e0bd6b"/>
</svg>
