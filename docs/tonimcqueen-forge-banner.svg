<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" role="img" aria-labelledby="title desc">
  <title id="title">ToniMcQueen's Forge</title>
  <desc id="desc">A compact Matrix-inspired neon banner for the ToniMcQueen Forge Creator 5 Pro firmware fork.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050914"/>
      <stop offset="0.52" stop-color="#11102b"/>
      <stop offset="1" stop-color="#210b24"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#22e6c0" stroke-opacity=".12"/>
    </pattern>
  </defs>

  <rect width="1200" height="220" rx="18" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="1197" height="217" rx="16.5" fill="url(#grid)" stroke="#4f7657" stroke-width="2"/>

  <g font-family="monospace" font-size="16" opacity=".7">
    <text x="44" y="42" fill="#78a87c">0101 0011 0100 0100</text>
    <text x="1050" y="42" fill="#78a87c">[ ONLINE ]</text>
    <text x="44" y="190" fill="#78a87c">&gt; forge.boot / creator5pro</text>
    <text x="1010" y="190" fill="#58775e">CMYW // IMAGEMAP</text>
  </g>

  <g font-family="monospace" font-weight="700" text-anchor="middle">
    <text x="600" y="145" font-size="50" letter-spacing="2" fill="#dce8dc">ToniMcQueen's Forge</text>
  </g>

  <path d="M210 184H990" stroke="#4f7657" stroke-width="2" opacity=".8"/>
  <circle cx="178" cy="184" r="5" fill="#78a87c"/>
  <circle cx="1022" cy="184" r="5" fill="#78a87c"/>
</svg>
