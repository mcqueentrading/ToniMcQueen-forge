# anvil-tailscale -- optional remote-access client.
#
# The package installs the static upstream tailscale/tailscaled mipsle binaries.
# anvil-core owns the s6 service and helper wrappers, because those are fork
# policy. The daemon is gated by an owner-created enable file, so installing
# this package never joins or exposes the printer by itself.
PKG_NAME=anvil-tailscale

PKG_VERSION="$TAILSCALE_VERSION"
PKG_RELEASE=1

PKG_EXCLUDE=".version"

PKG_DEPENDS=""
PKG_BUILD_DEPENDS=""

PKG_DESCRIPTION="Tailscale static mipsle binaries for optional userspace-networking remote access. Disabled until the owner enables and logs in."
