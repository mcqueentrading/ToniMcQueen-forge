# ---------------------------------------------------------------------------
# DO NOT EDIT THIS FILE. Every update overwrites it. Put your changes in
# printer.cfg instead: no flash ever writes that file. Klipper parses with
# RawConfigParser(strict=False), so same-named sections MERGE and the LAST
# value wins -- restate only what you are changing, at the END of printer.cfg.
# ---------------------------------------------------------------------------
# ff-chamber.cfg -- the chamber: heater (gated by model) and light.
#
# The Creator 5 Pro has a chamber heater; the plain Creator 5 does not. The
# declaration lives in printer.chamber.cfg, which differs by model: the Pro
# gets [heater_generic chamber_heater], the plain Creator 5 only
# [temperature_sensor chamber]. The non-Pro app reads the sensor and runs the
# chamber fans but never commands the heater, so its target stays 0.
#
# That is load-bearing, because FlashForge patched extras/verify_heater.py to
# HARDCODE its parameters and ignore the config, so overriding [verify_heater
# chamber_heater] does nothing. What keeps a non-Pro safe is only that nothing
# ever sets a target: check_event() returns early while target <= 0. Set one
# on a machine with no heating element and ~15 min later klippy calls
# invoke_shutdown("Heater chamber_heater not heating at expected rate"),
# mid-print. Mainsail and HelixScreen expose every heater_generic as settable,
# so on a non-Pro they hand the user that shutdown.
#
# This file closes it by gating the COMMAND rather than removing the section:
# the object has to stay declared because both UIs subscribe to it on both
# models. Whether this machine HAS the heater is not configured anywhere --
# these macros just ask Klipper whether the object exists, so this file is
# byte-identical in every package.
#
# REQUIRED -- not an optional drop-in.
# ---------------------------------------------------------------------------

[gcode_macro _FF_CHAMBER]
description: M141/M191 tunables
# M191 stops waiting this far below the target. The chamber is a slow, lossy
# volume; the app never waited on it tighter than a couple of degrees.
variable_wait_band: 2.0
# Speed for chamber_loop_fan while a chamber target is set; 0 disables the
# coupling entirely and leaves the fan to the user. See SET_HEATER_TEMPERATURE
# below for why this fan is driven here and chamber_heat_fan is not.
variable_loop_fan: 0.3
# When the chamber heater has a non-zero target, do not let generic aux fan
# commands fight it by pulling cold room air into the enclosure or exhausting
# warm air out. A slicer/operator can still force a short blast with
# `M106 P2 S<speed> COLD=1` or `M106 P3 S<speed> EXHAUST=1` for bridges.
variable_cold_air_while_heating: 0
variable_exhaust_while_heating: 0
# Never called: this holds the tunables above, nothing more. M141/M191 do the
# model gating themselves.
gcode:

[gcode_macro FF_CHAMBER_AIR_POLICY]
description: Configure chamber airflow policy for warm-material printing
gcode:
    {% set ff = printer['gcode_macro _FF_CHAMBER'] %}
    {% set loop = params.LOOP|default(ff.loop_fan)|float %}
    {% set cold = params.COLD_AIR_WHILE_HEATING|default(ff.cold_air_while_heating)|int %}
    {% set exhaust = params.EXHAUST_WHILE_HEATING|default(ff.exhaust_while_heating)|int %}
    {% if 'LOOP' in params %}
        SET_GCODE_VARIABLE MACRO=_FF_CHAMBER VARIABLE=loop_fan VALUE={loop}
    {% endif %}
    {% if 'COLD_AIR_WHILE_HEATING' in params %}
        SET_GCODE_VARIABLE MACRO=_FF_CHAMBER VARIABLE=cold_air_while_heating VALUE={cold}
    {% endif %}
    {% if 'EXHAUST_WHILE_HEATING' in params %}
        SET_GCODE_VARIABLE MACRO=_FF_CHAMBER VARIABLE=exhaust_while_heating VALUE={exhaust}
    {% endif %}
    { action_respond_info(
        "chamber airflow policy: loop=%.2f cold_air_while_heating=%d exhaust_while_heating=%d"
        % (loop, cold, exhaust)) }

# M106/M107 -- FlashForge fan P-map.
#
# Stock sliced files and our Orca profiles use FlashForge-style M106 P values:
#   no P / P1 : model fan
#   P2        : chamber loop + chamber cooling fan
#   P3        : chamber exhaust/filter fan
#   P101      : touchscreen "turbo" fan slot; ignored here unless a future
#               package declares a matching fan object.
#
# The chamber policy is adapted from the Creator-5-Mods community macro, but
# kept source-owned here. If the chamber heater has a target, P2 still runs
# recirculation but suppresses the cooling fan, and P3 suppresses exhaust, so
# a chamber-heated ABS/ASA print does not fight itself.
# For a temporary bridge/overhang blast during warm-material printing:
#   M106 P2 S180 COLD=1
#   M106 P3 S180 EXHAUST=1
[gcode_macro M106]
description: FlashForge fan map with chamber-heater-aware P2/P3 handling
gcode:
    {% set ff = printer['gcode_macro _FF_CHAMBER'] %}
    {% set speed = params.S|default(255)|float %}
    {% set speed = 0 if speed < 0 else (255 if speed > 255 else speed) %}
    {% set duty = speed / 255.0 %}
    {% set index = params.P|default(params.T|default(1))|int %}
    {% set chamber_target = 0.0 %}
    {% if 'heater_generic chamber_heater' in printer %}
        {% set chamber_target = printer['heater_generic chamber_heater'].target|default(0)|float %}
    {% endif %}
    {% set cold_allowed = params.COLD|default(ff.cold_air_while_heating)|int > 0 %}
    {% set exhaust_allowed = params.EXHAUST|default(ff.exhaust_while_heating)|int > 0 %}
    {% set cold_duty = 0.0 if chamber_target > 0 and not cold_allowed else duty %}
    {% set exhaust_duty = 0.0 if chamber_target > 0 and not exhaust_allowed else duty %}
    {% if index == 101 %}
        { action_respond_info("M106 P101 ignored: no turbo fan object is declared") }
    {% elif index == 2 %}
        SET_FAN_SPEED FAN=chamber_loop_fan SPEED={duty}
        SET_FAN_SPEED FAN=chamber_cool_fan SPEED={cold_duty}
    {% elif index == 3 %}
        SET_FAN_SPEED FAN=chamber_fan SPEED={exhaust_duty}
    {% else %}
        SET_FAN_SPEED FAN=fanM106 SPEED={duty}
    {% endif %}

[gcode_macro M107]
description: Fan off, preserving FlashForge P-map where supplied
gcode:
    M106 S0{% if 'P' in params %} P{params.P|int}{% elif 'T' in params %} T{params.T|int}{% endif %}

# SET_HEATER_TEMPERATURE -- stock command, chamber target gated by model, and
# the one choke point every chamber target passes through.
#
# Anything that is not a chamber command passes straight through, so hotends
# and the bed behave exactly as before. A chamber command on a model with no
# chamber heater is swallowed instead: the base command is a mux keyed on
# HEATER and would raise "The value 'chamber_heater' is not valid for HEATER",
# which is right for a command someone typed but aborts a print when the line
# came out of a slicer. PID_CALIBRATE and anything else reaching past these
# macros still fails, as it should.
#
# It also carries the second half of the chamber fan coupling. firmwareExe ran
# TWO fans with the element -- chamber_heat_fan at 0.9 and chamber_loop_fan at
# 0.3, both fired from CommMgr::heatManager on a plain "target != 0" test --
# and this mod replaces the binary that did it. chamber_heat_fan is now a
# [heater_fan] in printer.chamber.cfg, which is the better home: it follows the
# target without any G-code running, so a pause, a cancel or a klippy fault
# cannot strand a hot element behind a stopped fan.
#
# chamber_loop_fan cannot go the same way. HelixScreen publishes it by object
# name as the user's "aux" fan (settings.json: "aux": "fan_generic
# chamber_loop_fan"), and a [heater_fan] is neither that object nor settable at
# all, so converting it would take the aux slider away and break the name the
# UI resolves. It stays a [fan_generic] and is driven from here instead --
# which is exactly where the app drove it, and unlike the app this reaches
# every client, not just the touchscreen.
#
# Like the app, this overwrites a manual aux setting: 0.3 while a target is
# set, 0 when it is cleared. Set _FF_CHAMBER's loop_fan to 0 to keep the fan
# entirely under the user's hand. The fan leads the heater on the way up and
# trails it on the way down, so the chamber is never heating unventilated.
[gcode_macro SET_HEATER_TEMPERATURE]
description: Set a heater target (chamber ignored on models without the heater)
rename_existing: SET_HEATER_TEMPERATURE_BASE
gcode:
    {% set heater = params.HEATER|default('')|lower %}
    {% set target = params.TARGET|default(0)|float %}
    {% set ff = printer['gcode_macro _FF_CHAMBER'] %}
    {% set is_chamber = heater == 'chamber_heater'
                        and 'heater_generic chamber_heater' in printer %}
    {% set loop = ff.loop_fan|float %}
    {% if heater == 'chamber_heater'
          and 'heater_generic chamber_heater' not in printer %}
        # Every chamber command is blocked here, not just a non-zero target.
        # SET_HEATER_TEMPERATURE is a mux command keyed on HEATER, so on a
        # model that never registered chamber_heater the base command raises
        # "The value 'chamber_heater' is not valid for HEATER" -- a command
        # error, which aborts the running print. TARGET=0 raises it exactly as
        # TARGET=60 does, and slicers put M141 S0 in their end G-code, so
        # gating only on target > 0 left the common case failing.
        #
        # Turning off a heater that does not exist is a no-op, so it passes in
        # silence; only a real request being dropped is worth a message.
        {% if target > 0 %}
            { action_respond_info(
                "no chamber heater on this model -- ignoring TARGET=%.1f" % target) }
        {% endif %}
    {% else %}
        {% if is_chamber and loop > 0 and target > 0 %}
            SET_FAN_SPEED FAN=chamber_loop_fan SPEED={loop}
        {% endif %}
        SET_HEATER_TEMPERATURE_BASE {rawparams}
        {% if is_chamber and loop > 0 and target <= 0 %}
            SET_FAN_SPEED FAN=chamber_loop_fan SPEED=0
        {% endif %}
    {% endif %}

# M141 [S<temp>] -- set chamber temperature, do not wait.
# M191 [S<temp>] -- set chamber temperature and wait for it.
# Klipper has neither built in, and the stock app drove the chamber from its
# own UI, so nothing in stock firmware ever accepted them from a sliced file.
# Both route through SET_HEATER_TEMPERATURE and inherit the model gate.
[gcode_macro M141]
description: Set chamber temperature (S=target, 0 = off)
gcode:
    SET_HEATER_TEMPERATURE HEATER=chamber_heater TARGET={params.S|default(0)|float}

[gcode_macro M191]
description: Set chamber temperature and wait (S=target, 0 = off)
gcode:
    {% set target = params.S|default(0)|float %}
    {% set ff = printer['gcode_macro _FF_CHAMBER'] %}
    SET_HEATER_TEMPERATURE HEATER=chamber_heater TARGET={target}
    {% if target > 0 and 'heater_generic chamber_heater' in printer %}
        TEMPERATURE_WAIT SENSOR="heater_generic chamber_heater" MINIMUM={target - ff.wait_band|float}
    {% endif %}

# ---------------------------------------------------------------------------
# The chamber light, off at startup for the Creator 5 Pro full-colour workflow.
#
# printer.base.cfg declares [led chamber_led] and stops there, as FlashForge
# ships it. Klipper defaults initial_WHITE to 0, and switching the light was
# firmwareExe's job -- the binary this mod replaces. Stock Reforge turns it on
# here; this branch keeps it dark at boot so camera/timelapse lighting is an
# explicit user choice rather than startup side effect.
#
# Overriding one option rather than restating the section: a second
# [led chamber_led] MERGES into the first and white_pin carries over from
# printer.base.cfg, which is FlashForge's file verbatim. This file is included
# after it, which is what makes the override land.
#
# To drive it by hand:
#     SET_LED LED=chamber_led WHITE=1     ; on
#     SET_LED LED=chamber_led WHITE=0     ; off
# Keep initial_WHITE at 0 for a machine that should boot dark.
# ---------------------------------------------------------------------------
[led chamber_led]
initial_WHITE: 0.0
