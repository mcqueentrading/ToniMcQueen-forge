# By using these files I affirm my respect for Ukraine's sovereignty and
# territorial integrity and my support for UN GA resolution ES-11/1.

# ---------------------------------------------------------------------------
# DO NOT EDIT THIS FILE. Every update overwrites it. Put your changes in
# printer.cfg instead: no flash ever writes that file. Klipper parses with
# RawConfigParser(strict=False), so same-named sections MERGE and the LAST
# value wins -- restate only what you are changing, at the END of printer.cfg.
# ---------------------------------------------------------------------------
# ff-runout.cfg -- filament runout / clog handling for Mainsail prints.
#
# The stock config ships all eight sensors with pause_on_runout: False and a
# runout_gcode that only prints "wheel runout:Tn" -- the touchscreen app did
# the rest, polling the MOUNTED channel's switch sensor from its print engine
# and keeping only the mounted tool's motion sensor enabled. See
# docs/notes/49-runout-recovered.md.
#
# The port splits the job: ff_toolchange.py arms the mounted tool's hard
# switch sensor on grab and leaves the soft motion/clog sensor off unless a
# print policy explicitly arms it. This file gives both sensor kinds a
# runout_gcode that acts ONLY when an SD print is running and the sensor
# belongs to the mounted tool. Switch runout is hard fault. Motion runout is
# soft clog suspicion: first event warns, repeated confirmed events pause.
#
# INSTALL: nothing to do -- printer.base.cfg ships the include. It lands AFTER
# the stock printer.filament.cfg, which is what makes this file work, so it
# only has to restate the options it changes. Do not edit
# printer.filament.cfg; the OTA overwrites it.
# ---------------------------------------------------------------------------

[filament_switch_sensor fd_ex0]
pause_on_runout: False
runout_gcode:
    _FF_RUNOUT TOOL=0 KIND=switch
insert_gcode:
    _FF_INSERT TOOL=0 KIND=switch

[filament_motion_sensor fm_ex0]
pause_on_runout: False
runout_gcode:
    _FF_RUNOUT TOOL=0 KIND=motion
insert_gcode:
    _FF_INSERT TOOL=0 KIND=motion

[filament_switch_sensor fd_ex1]
pause_on_runout: False
runout_gcode:
    _FF_RUNOUT TOOL=1 KIND=switch
insert_gcode:
    _FF_INSERT TOOL=1 KIND=switch

[filament_motion_sensor fm_ex1]
pause_on_runout: False
# Stock binds all four motion sensors to `extruder` (extruder0), so a clog on
# T1..T3 was measured against T0's movement. Each sensor watches its own tool.
extruder: extruder1
runout_gcode:
    _FF_RUNOUT TOOL=1 KIND=motion
insert_gcode:
    _FF_INSERT TOOL=1 KIND=motion

[filament_switch_sensor fd_ex2]
pause_on_runout: False
runout_gcode:
    _FF_RUNOUT TOOL=2 KIND=switch
insert_gcode:
    _FF_INSERT TOOL=2 KIND=switch

[filament_motion_sensor fm_ex2]
pause_on_runout: False
extruder: extruder2
runout_gcode:
    _FF_RUNOUT TOOL=2 KIND=motion
insert_gcode:
    _FF_INSERT TOOL=2 KIND=motion

[filament_switch_sensor fd_ex3]
pause_on_runout: False
runout_gcode:
    _FF_RUNOUT TOOL=3 KIND=switch
insert_gcode:
    _FF_INSERT TOOL=3 KIND=switch

[filament_motion_sensor fm_ex3]
pause_on_runout: False
extruder: extruder3
runout_gcode:
    _FF_RUNOUT TOOL=3 KIND=motion
insert_gcode:
    _FF_INSERT TOOL=3 KIND=motion

# Policy knobs. switch_pause has no app equivalent -- hard switch runout should
# pause. clog_pause is the app's general.json "plugCheck" equivalent; when 0,
# motion faults warn only. motion_pause_after is the confirmation count for
# soft clog suspicion. The diagnostic run showed all four motion sensors count
# purge/load movement, so fake clogs are lifecycle bugs, not dead hardware.
[gcode_macro _FF_RUNOUT_CFG]
variable_switch_pause: 1
variable_clog_pause: 1
variable_motion_pause_after: 2
variable_motion_fault_t0: 0
variable_motion_fault_t1: 0
variable_motion_fault_t2: 0
variable_motion_fault_t3: 0
gcode:

[gcode_macro REFORGE_DISARM_MOTION_SENSORS]
description: Disable all soft clog/motion sensors without disabling hard switch runout
gcode:
    FF_RUNOUT_DISARM MOTION_ONLY=1

[gcode_macro REFORGE_ARM_SWITCH_SENSOR]
description: Arm hard switch runout for one mounted tool, leave motion/clog off
gcode:
    {% set tool = params.TOOL|default(printer.ff_toolchange.current_tool)|int %}
    {% if tool < 0 or tool > 3 %}
        { action_raise_error("TOOL=0..3 required") }
    {% endif %}
    {% if tool != printer.ff_toolchange.current_tool %}
        { action_raise_error("T%d is not mounted; current tool is T%d" % (tool, printer.ff_toolchange.current_tool)) }
    {% endif %}
    FF_RUNOUT_ARM TOOL={tool} SWITCH=1 MOTION=0

[gcode_macro REFORGE_ARM_MOTION_SENSOR]
description: Arm print-scoped soft clog/motion detection for one mounted tool
gcode:
    {% set tool = params.TOOL|default(printer.ff_toolchange.current_tool)|int %}
    {% if tool < 0 or tool > 3 %}
        { action_raise_error("TOOL=0..3 required") }
    {% endif %}
    {% if tool != printer.ff_toolchange.current_tool %}
        { action_raise_error("T%d is not mounted; current tool is T%d" % (tool, printer.ff_toolchange.current_tool)) }
    {% endif %}
    {% if tool == 0 %}
        SET_GCODE_VARIABLE MACRO=_FF_RUNOUT_CFG VARIABLE=motion_fault_t0 VALUE=0
    {% elif tool == 1 %}
        SET_GCODE_VARIABLE MACRO=_FF_RUNOUT_CFG VARIABLE=motion_fault_t1 VALUE=0
    {% elif tool == 2 %}
        SET_GCODE_VARIABLE MACRO=_FF_RUNOUT_CFG VARIABLE=motion_fault_t2 VALUE=0
    {% else %}
        SET_GCODE_VARIABLE MACRO=_FF_RUNOUT_CFG VARIABLE=motion_fault_t3 VALUE=0
    {% endif %}
    FF_RUNOUT_ARM TOOL={tool} SWITCH=1 MOTION=1
    { action_respond_info("Reforge motion/clog sensor armed for T%d after non-print purge/load path" % tool) }

[gcode_macro REFORGE_FILAMENT_SENSOR_TEST]
description: Manual sensor lifecycle test: arm motion, purge/load LENGTH, report policy state
gcode:
    {% set tool = params.TOOL|default(printer.ff_toolchange.current_tool)|int %}
    {% set temp = params.TEMP|default(220)|float %}
    {% set length = params.LENGTH|default(150)|float %}
    {% set hold = params.HOLD|default(120)|float %}
    {% if tool < 0 or tool > 3 %}
        { action_raise_error("TOOL=0..3 required") }
    {% endif %}
    REFORGE_DISARM_MOTION_SENSORS
    LOAD_FILAMENT TOOL={tool} TEMP={temp} BOOST=0 LENGTH={length} RETRACT=0 RELEASE=0 HEAT_OFF=0
    REFORGE_ARM_SWITCH_SENSOR TOOL={tool}
    M104 S{hold} T{tool}
    { action_respond_info("Sensor test complete for T%d: purge/load used with motion sensors disarmed; switch re-armed, hotend held at %.0f C" % (tool, hold)) }

# Called by the sensors' runout_gcode. Klipper already filters on the
# idle_timeout "Printing" state (any motion counts, a LOAD_FILAMENT too), so
# the SD-job check here is what keeps a manual unload from pausing nothing.
[gcode_macro _FF_RUNOUT]
gcode:
    {% set tool = params.TOOL|int %}
    {% set kind = params.KIND|default('switch') %}
    {% set cfg = printer["gcode_macro _FF_RUNOUT_CFG"] %}
    {% set tc = printer.ff_toolchange %}
    {% set sensor = ('fm_ex' if kind == 'motion' else 'fd_ex') ~ tool %}
    {% if printer.print_stats.state != 'printing' or printer.pause_resume.is_paused %}
        { action_respond_info("%s: runout event on T%d ignored (no print running)" % (sensor, tool)) }
    {% elif tool != tc.current_tool %}
        { action_respond_info("%s: runout event on T%d ignored (mounted tool is T%d)" % (sensor, tool, tc.current_tool)) }
    {% elif kind == 'motion' and not cfg.clog_pause %}
        { action_respond_info("%s: clog detected on T%d -- not pausing (clog_pause=0)" % (sensor, tool)) }
    {% elif kind != 'motion' and not cfg.switch_pause %}
        { action_respond_info("%s: filament runout on T%d -- not pausing (switch_pause=0)" % (sensor, tool)) }
    {% elif kind == 'motion' %}
        {% set count = cfg.motion_fault_t0 if tool == 0 else cfg.motion_fault_t1 if tool == 1 else cfg.motion_fault_t2 if tool == 2 else cfg.motion_fault_t3 %}
        {% set next = count|int + 1 %}
        {% if tool == 0 %}
            SET_GCODE_VARIABLE MACRO=_FF_RUNOUT_CFG VARIABLE=motion_fault_t0 VALUE={next}
        {% elif tool == 1 %}
            SET_GCODE_VARIABLE MACRO=_FF_RUNOUT_CFG VARIABLE=motion_fault_t1 VALUE={next}
        {% elif tool == 2 %}
            SET_GCODE_VARIABLE MACRO=_FF_RUNOUT_CFG VARIABLE=motion_fault_t2 VALUE={next}
        {% else %}
            SET_GCODE_VARIABLE MACRO=_FF_RUNOUT_CFG VARIABLE=motion_fault_t3 VALUE={next}
        {% endif %}
        {% if next < cfg.motion_pause_after|int %}
            M117 T{tool} motion warning
            { action_respond_info("%s: possible clog on T%d ignored as soft fault %d/%d; next confirmed event pauses" % (sensor, tool, next, cfg.motion_pause_after|int)) }
        {% else %}
            PAUSE
            M117 T{tool} clog
            { action_respond_info("Paused: confirmed clog on T%d after %d motion faults. Clear it, then RESUME (or CANCEL_PRINT)." % (tool, next)) }
        {% endif %}
    {% else %}
        PAUSE
        M117 T{tool} out of filament
        {% if tool == 0 %}
            SET_GCODE_VARIABLE MACRO=_FF_RUNOUT_CFG VARIABLE=motion_fault_t0 VALUE=0
        {% elif tool == 1 %}
            SET_GCODE_VARIABLE MACRO=_FF_RUNOUT_CFG VARIABLE=motion_fault_t1 VALUE=0
        {% elif tool == 2 %}
            SET_GCODE_VARIABLE MACRO=_FF_RUNOUT_CFG VARIABLE=motion_fault_t2 VALUE=0
        {% else %}
            SET_GCODE_VARIABLE MACRO=_FF_RUNOUT_CFG VARIABLE=motion_fault_t3 VALUE=0
        {% endif %}
        { action_respond_info("Paused: T%d ran out. Feed new filament, then LOAD_FILAMENT TOOL=%d and RESUME (or CANCEL_PRINT)." % (tool, tool)) }
    {% endif %}

# Called by the sensors' insert_gcode (Klipper only fires it while idle, so
# this never interrupts a moving print). A switch insert means filament is
# present again; a motion insert means it is MOVING again, which is what
# clearing a clog looks like.
[gcode_macro _FF_INSERT]
gcode:
    {% set tool = params.TOOL|int %}
    {% set kind = params.KIND|default('switch') %}
    {% if kind == 'switch' %}
        {% if tool == 0 %}
            SET_GCODE_VARIABLE MACRO=_FF_RUNOUT_CFG VARIABLE=motion_fault_t0 VALUE=0
        {% elif tool == 1 %}
            SET_GCODE_VARIABLE MACRO=_FF_RUNOUT_CFG VARIABLE=motion_fault_t1 VALUE=0
        {% elif tool == 2 %}
            SET_GCODE_VARIABLE MACRO=_FF_RUNOUT_CFG VARIABLE=motion_fault_t2 VALUE=0
        {% else %}
            SET_GCODE_VARIABLE MACRO=_FF_RUNOUT_CFG VARIABLE=motion_fault_t3 VALUE=0
        {% endif %}
        {% if printer.pause_resume.is_paused and tool == printer.ff_toolchange.current_tool %}
            { action_respond_info("Filament detected in T%d: LOAD_FILAMENT TOOL=%d, then RESUME." % (tool, tool)) }
        {% elif not printer.pause_resume.is_paused %}
            { action_respond_info("Filament detected in T%d: LOAD_FILAMENT TOOL=%d to feed it." % (tool, tool)) }
        {% endif %}
    {% else %}
        {% if printer.pause_resume.is_paused and tool == printer.ff_toolchange.current_tool %}
            { action_respond_info("T%d is moving filament again: RESUME to continue (or CANCEL_PRINT)." % tool) }
        {% endif %}
    {% endif %}
