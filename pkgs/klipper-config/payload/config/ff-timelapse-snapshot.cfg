# Lightweight still-frame timelapse helpers.
#
# Reforge ships moonraker-timelapse, but rendering video on the printer is
# expensive. These macros only capture JPEG frames and intentionally never call
# TIMELAPSE_RENDER. The slicer profile calls REFORGE_SNAPSHOT_EVERY_MINUTE on
# layer changes; the macro throttles captures so tall ImageMap prints do not
# spam the X2000.

[gcode_macro REFORGE_SNAPSHOT_START]
description: Enable snapshot-only timelapse capture and reset the throttle timer.
gcode:
    SET_GCODE_VARIABLE MACRO=REFORGE_SNAPSHOT_EVERY_MINUTE VARIABLE=last_frame_time VALUE=0
    SET_GCODE_VARIABLE MACRO=TIMELAPSE_TAKE_FRAME VARIABLE=enable VALUE=True

[gcode_macro REFORGE_SNAPSHOT_FINISH]
description: Disable still capture and archive saved JPEG frames; no video render.
gcode:
    SET_GCODE_VARIABLE MACRO=TIMELAPSE_TAKE_FRAME VARIABLE=enable VALUE=False
    {action_call_remote_method("timelapse_saveFrames")}

[gcode_macro REFORGE_SNAPSHOT_EVERY_MINUTE]
description: Take one timelapse still at most every INTERVAL seconds; no video render.
variable_last_frame_time: 0.0
variable_interval: 60.0
gcode:
    {% set macro = printer["gcode_macro REFORGE_SNAPSHOT_EVERY_MINUTE"] %}
    {% set interval = params.INTERVAL|default(macro.interval)|float %}
    {% set now = printer.toolhead.estimated_print_time|float %}
    {% set last = macro.last_frame_time|float %}
    {% if last <= 0 or now - last >= interval %}
        SET_GCODE_VARIABLE MACRO=REFORGE_SNAPSHOT_EVERY_MINUTE VARIABLE=last_frame_time VALUE={now}
        TIMELAPSE_TAKE_FRAME
    {% endif %}
